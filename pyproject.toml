[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-viz"
version = "0.1.0"
description = "A small, opinionated visualization library built on matplotlib."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["simple_viz"]

[tool.setuptools.package-data]
simple_viz = ["fonts/*.ttf"]
